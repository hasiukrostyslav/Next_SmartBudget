# Weekly dependency PRs so a security advisory arrives as a pull request
# instead of being discovered by an audit. Minor and patch updates are grouped
# to keep the PR count manageable; majors come one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
